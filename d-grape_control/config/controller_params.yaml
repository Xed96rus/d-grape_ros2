/**/controller_manager:
  ros__parameters:

    use_sim_time: true # This will be set to false on real robot in launch file

    update_rate: 1000

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


/**/diff_drive_controller:
  ros__parameters:

    use_sim_time: true # This will be set to false on real robot in launch file

    publish_rate: 50.0 # You can set this higher than the controller manager update rate, but it will be throttled

    wheels_per_side: 4
    use_stamped_vel: false # Depending on if cmd_vel is presented as Twist or TwistStamped:
    enable_odom_tf: false

    # Robot model
    base_frame_id: base_link
    left_wheel_names: [
      "base_to_left_star",
      "base_to_left_f_roller",
      "base_to_left_b_roller",
      "base_to_left_roller_star",
    ]
    right_wheel_names: [
      "base_to_right_star",
      "base_to_right_f_roller",
      "base_to_right_b_roller",
      "base_to_right_roller_star",
    ]
    wheel_separation: 0.45
    wheel_radius: 0.1